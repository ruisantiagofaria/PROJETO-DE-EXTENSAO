<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro do Falecido | Memorial Vida Eterna</title>
  <!-- copie aqui o mesmo <link rel="stylesheet"> das outras páginas -->
  <style>
    .cadastro { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .cadastro fieldset { border: 1px solid #ccc; border-radius: 8px; margin-bottom: 16px; padding: 12px 16px; }
    .cadastro label { display: block; margin-top: 10px; font-weight: 600; }
    .cadastro input, .cadastro select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    .cadastro button { margin-top: 12px; padding: 10px 18px; cursor: pointer; }
    #mensagem.ok { color: #1a7f37; } #mensagem.erro { color: #b42318; }
    .tabela-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
  </style>
</head>
<body>
      <header class="header-vms d-flex align-items-center justify-content-between p-2">
        <div class="d-flex align-items-center" style="flex: 1;">
            <a href="index.html">
                <img src="img/logo.png" alt="VMS Móveis Planejados" class="logo">
            </a>
        </div>

        <div class="d-flex justify-content-center" style="flex: 1;">
            <h2 class="titulo-vms m-0 text-center">Cemitério Centro Memorial Vida Eterna</h2>
        </div>

        <div class="d-flex justify-content-end" style="flex: 1;">
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </header>

  <main class="cadastro">
    <h1>Cadastro do Falecido</h1>

    <form id="form-falecido" novalidate>
      <fieldset>
        <legend>Dados do falecido</legend>
        <label>Nome completo
          <input type="text" name="nome" required>
        </label>
        <label>Data de nascimento
          <input type="date" name="dataNascimento" required>
        </label>
        <label>Data do óbito
          <input type="date" name="dataObito" required>
        </label>
        <label>Nº da Declaração de Óbito
          <input type="text" name="numeroDO" required>
        </label>
      </fieldset>

      <fieldset>
        <legend>Responsável legal</legend>
        <label>Nome do responsável
          <input type="text" name="respNome" required>
        </label>
        <label>Telefone
          <input type="tel" name="respTelefone" required>
        </label>
        <label>Parentesco
          <input type="text" name="respParentesco">
        </label>
      </fieldset>

      <fieldset>
        <legend>Tarifa</legend>
        <label>Tipo de tarifa
          <select name="tarifa">
            <option value="normal">Normal</option>
            <option value="social">Tarifa social</option>
            <option value="gratuidade">Gratuidade</option>
          </select>
        </label>
        <label>Documento comprobatório (se social/gratuidade)
          <input type="text" name="comprovante" placeholder="Ex.: CadÚnico, declaração...">
        </label>
      </fieldset>

      <button type="submit">Cadastrar</button>
      <p id="mensagem" role="alert"></p>
    </form>

    <h2>Falecidos cadastrados</h2>
    <div class="tabela-wrap">
      <table id="tabela">
        <thead>
          <tr><th>Nome</th><th>Óbito</th><th>Nº DO</th><th>Responsável</th><th>Tarifa</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- COLE AQUI o <footer> do index.html -->
  <script src="cadastro.js"></script>
</body>
</html>
